name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image
        run: |
          docker build ./back -t my-debt-app-backend:latest

      - name: Build Frontend Image
        run: |
          docker build ./front -t my-debt-app-frontend:latest

      - name: Test Docker Compose
        run: |
          docker compose up -d
          sleep 10
          docker compose ps
