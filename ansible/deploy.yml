- name: Deploy Debt App to Yandex Cloud
  hosts: web_servers
  become: yes
  tasks:
    - name: Update apt and install dependencies
      apt:
        update_cache: yes
        name: [apt-transport-https, ca-certificates, curl, software-properties-common, docker.io]

    - name: Install Docker Compose Plugin
      apt:
        name: docker-compose-v2 
        state: present

    - name: Create monitoring directory on server
      file:
        path: /home/ubuntu/monitoring
        state: directory
        mode: '0755'

    - name: Copy prometheus.yml to server
      copy:
        src: ../monitoring/prometheus.yml
        dest: /home/ubuntu/monitoring/prometheus.yml

    - name: Copy docker-compose.yml to server
      copy:
        src: ../docker-compose.yml
        dest: /home/ubuntu/docker-compose.yml

    - name: Pull images and start app
      shell: |
        docker compose -f /home/ubuntu/docker-compose.yml pull
        docker compose -f /home/ubuntu/docker-compose.yml up -d
