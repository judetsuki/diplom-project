services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: debt_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d debt_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./back
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/debt_db
      - SECRET_KEY=prod_secret_123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./front
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
