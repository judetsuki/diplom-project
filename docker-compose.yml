services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: debt_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d debt_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  backend:
    image: mtfoxtrot/debt-back:latest
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/debt_db
      - SECRET_KEY=prod_secret_123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: mtfoxtrot/debt-front:latest
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
